---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nextcloud-secrets
  data:
    - secretKey: username
      remoteRef:
        key: kv/kubernetes/nextcloud
        property: username
    - secretKey: password
      remoteRef:
        key: kv/kubernetes/nextcloud
        property: password
    - secretKey: smtpHost
      remoteRef:
        key: kv/kubernetes/nextcloud
        property: smtpHost
    - secretKey: smtpUsername
      remoteRef:
        key: kv/kubernetes/nextcloud
        property: smtpUsername
    - secretKey: smtpPassword
      remoteRef:
        key: kv/kubernetes/nextcloud
        property: smtpPassword