---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meilisearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  destination:
    namespace: meilisearch
    server: 'https://kubernetes.default.svc'
  sources:
  - repoURL: 'https://meilisearch.github.io/meilisearch-kubernetes'
    chart: meilisear
    targetRevision: 0.40.0
    helm:
      valueFiles:
      - $values/meilisearch/values.yaml
  - repoURL: 'git@github.com:DawidDe/argocd-values.git'
    targetRevision: main
    ref: values
  - repoURL: 'https://github.com/dawidde/homelab.git'
    path: argocd/apps/platform/meilisearch/manifests
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
    - CreateNamespace=true
