---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meili
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  destination:
    namespace: meili
    server: 'https://kubernetes.default.svc'
  sources:
  - repoURL: 'https://meilisearch.github.io/meilisearch-kubernetes'
    chart: meilisearch
    targetRevision: 0.40.0
    helm:
      valueFiles:
      - $values/meili/values.yaml
  - repoURL: 'git@github.com:DawidDe/argocd-values.git'
    targetRevision: main
    ref: values
  - repoURL: 'https://github.com/dawidde/homelab.git'
    path: base/kubernetes/meili/manifests
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      enabled: true
    syncOptions:
    - CreateNamespace=true
