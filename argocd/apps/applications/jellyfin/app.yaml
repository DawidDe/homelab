---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  destination:
    namespace: jellyfin
    server: 'https://kubernetes.default.svc'
  sources:
  - repoURL: 'https://jellyfin.github.io/jellyfin-helm/'
    chart: jellyfin
    targetRevision: 3.2.0
    helm:
      valueFiles:
      - $values/jellyfin/values.yaml
  - repoURL: 'git@github.com:DawidDe/argocd-values.git'
    targetRevision: main
    ref: values
  - repoURL: 'https://github.com/dawidde/homelab.git'
    path: argocd/apps/applications/jellyfin/manifests
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
    - CreateNamespace=true