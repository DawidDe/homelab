---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mealie
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  destination:
    namespace: mealie
    server: 'https://kubernetes.default.svc'
  sources:
  - repoURL: 'oci://ghcr.io/jvalskis/mealie-helm/mealie'
    chart: mealie
    targetRevision: 3.0.2
    helm:
      valueFiles:
      - $values/mealie/values.yaml
  - repoURL: 'git@github.com:DawidDe/argocd-values.git'
    targetRevision: main
    ref: values
  - repoURL: 'https://github.com/dawidde/homelab.git'
    path: argocd/apps/applications/mealie/manifests
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
    - CreateNamespace=true
