apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fluxer-secrets
  namespace: fluxer
  argocd.argoproj.io/hook: PreSync
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: fluxer-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: kv/kubernetes/fluxer
        property: postgresPassword
    - secretKey: FLUXER_POSTGRES_PASSWORD
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerPostgresPassword
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: kv/kubernetes/fluxer
        property: meiliMasterKey
    - secretKey: FLUXER_SEARCH_API_KEY
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerSearchAPIKey
    - secretKey: LIVEKIT_API_SECRET
      remoteRef:
        key: kv/kubernetes/fluxer
        property: livekitAPISecret
    - secretKey: FLUXER_LIVEKIT_API_SECRET
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerLivekitAPISecret
    - secretKey: LIVEKIT_KEYS
      remoteRef:
        key: kv/kubernetes/fluxer
        property: livekitKeys
    - secretKey: FLUXER_S3_ACCESS_KEY_ID
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerS3AccessKeyID
    - secretKey: FLUXER_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerS3SecretAccessKey
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kv/kubernetes/fluxer
        property: awsAccessKeyID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kv/kubernetes/fluxer
        property: awsSecretAccessKey
    - secretKey: FLUXER_SUDO_MODE_SECRET
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerSudoModeSecret
    - secretKey: FLUXER_CONNECTION_INITIATION_SECRET
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerConnectionInitiationSecret
    - secretKey: FLUXER_GATEWAY_RPC_AUTH_TOKEN
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerGatewayRPCAuthToken
    - secretKey: FLUXER_MEDIA_PROXY_SECRET_KEY
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerMediaProxySecretKey
    - secretKey: FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerMediaProxyUploadRelaySecretBase64
    - secretKey: FLUXER_ADMIN_SECRET_KEY_BASE
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerAdminSecretKeyBase
    - secretKey: FLUXER_ADMIN_OAUTH_CLIENT_SECRET
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerAdminOauthClientSecret
    - secretKey: FLUXER_VAPID_PUBLIC_KEY
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerVAPIDPublicKey
    - secretKey: FLUXER_VAPID_PRIVATE_KEY
      remoteRef:
        key: kv/kubernetes/fluxer
        property: fluxerVPAIDPrivateKey