---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  sources:
  - repoURL: 'https://github.com/dawidde/homelab.git'
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
      include: '{applications/*/app.yaml,infrastructure/*/app.yaml,platform/*/app.yaml}'
      exclude: '**/manifests/**'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true