---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  sources:
  - repoURL: 'https://github.com/dawidde/homelab.git'
    targetRevision: main
    path: base/kubernetes
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true