---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
  namespace: jellyfin
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "jellyfin-media"
  mountOptions:
    - guest
    - ro
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: media
    volumeAttributes:
      source: "//192.168.178.3/media"
  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "jellyfin-media"
  volumeName: jellyfin-media
  resources:
    requests:
      storage: 1Ti