---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: jellyfin
      version: "3.2.x"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: jellyfin
  values:
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: "longhorn"
      media:
        enabled: true
        type: pvc
        accessMode: ReadWriteOnce
        size: 5Gi
        existingClaim: "jellyfin-media"
  releaseName: jellyfin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled