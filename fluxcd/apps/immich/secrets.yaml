apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secrets
  namespace: immich
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: immich-secrets
  data:
    - secretKey: dbUsername
      remoteRef:
        key: kv/kubernetes/immich
        property: dbUsername
    - secretKey: dbPassword
      remoteRef:
        key: kv/kubernetes/immich
        property: dbPassword