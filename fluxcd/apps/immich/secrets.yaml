---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-smb-secrets
  namespace: immich
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: immich-smb-secrets
  data:
    - secretKey: username
      remoteRef:
        key: kv/kubernetes/immich
        property: smbUsername

    - secretKey: password
      remoteRef:
        key: kv/kubernetes/immich
        property: smbPassword