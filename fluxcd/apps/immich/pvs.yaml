---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
  namespace: immich
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "immich-library"
  mountOptions:
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: media
    volumeAttributes:
      source: "//192.168.178.3/media"
    nodeStageSecretRef:
      name: immich-smb-secrets
      namespace: immich
  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "immich-library"
  volumeName: immich-library
  resources:
    requests:
      storage: 1Ti