---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
  namespace: newt
spec:
  dependsOn:
    - name: external-secrets-operator
      namespace: external-secrets-operator
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: newt
      version: "1.5.x"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: newt
  values:
    newtInstances:
      - name: main
        enabled: true
        auth:
          existingSecretName: newt-secrets
          keys:
            endpointKey: PANGOLIN_ENDPOINT
            idKey: NEWT_ID
            secretKey: NEWT_SECRET
          configPersistence:
            enabled: true
            mountPath: "/var/lib/newt"
            fileName: "config.json"
            type: emptyDir
            existingClaim: ""
          mtu: 1280  
  releaseName: newt
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled