--- 
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-operator
  
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-operator
  namespace: prometheus-operator
spec:
  interval: 12h
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  ref:
    tag: "94.2.0"
  
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: prometheus-operator
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: prometheus-operator
  values:
    defaultRules:
      create: false
    prometheus:
      agentMode: true
      prometheusSpec:
        remoteWrite:
          - url: https://prometheus.dawidde.de/push
    alertmanager:
      enabled: false
    grafana:
      enabled: false
  releaseName: prometheus-operator 
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled