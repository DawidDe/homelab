--- 
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-operator
  namespace: prometheus-operator
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
  
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: prometheus-operator
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "94.2.x"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: prometheus-operator
  values:
    defaultRules:
      create: false
    prometheus:
      agentMode: true
      prometheusSpec:
        remoteWrite:
          - url: https://prometheus.dawidde.de/api/v1/write
    alertmanager:
      enabled: false
    grafana:
      enabled: false
  releaseName: prometheus-operator 
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled