--- 
apiVersion: v1
kind: Namespace
metadata:
  name: meilisearch
  
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: meilisearch
  namespace: meilisearch
spec:
  interval: 1h
  url: https://meilisearch.github.io/meilisearch-kubernetes
  
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meilisearch
  namespace: meilisearch
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: external-secrets-operator
      namespace: external-secrets-operator 
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: meilisearch
      version: "0.41.x"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: meilisearch
  values:
    auth:
      existingMasterKeySecret: "meilisearch-secrets"

    persistence:
      enabled: true
      storageClass: "longhorn" 
  releaseName: meilisearch
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled