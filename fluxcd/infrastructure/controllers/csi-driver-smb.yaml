---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 1h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
  
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: csi-driver-smb
      version: "1.20.x"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
  releaseName: csi-driver-smb 
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled