--- 
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-operator
  
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets-operator
  namespace: external-secrets-operator
spec:
  interval: 1h
  url: https://charts.external-secrets.io
  
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-operator
  namespace: external-secrets-operator
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: external-secrets
      version: "2.13.x"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: external-secrets-operator
  releaseName: external-secrets-operator 
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled