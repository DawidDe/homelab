--- 
apiVersion: v1
kind: Namespace
metadata:
  name: newt
  
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: newt
  namespace: newt
spec:
  interval: 1h
  url: https://charts.fossorial.io
  
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
  namespace: newt
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: newt
      version: "1.5.x"
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: newt
  releaseName: newt
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 
  test:
    enable: true
  driftDetection:
    mode: enabled