apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-secrets
  namespace: longhorn-system
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: longhorn-secrets
  data:
    - secretKey: CIFS_USERNAME
      remoteRef:
        key: kv/kubernetes/longhorn
        property: cifsUsername
    - secretKey: CIFS_PASSWORD
      remoteRef:
        key: kv/kubernetes/longhorn
        property: cifsPassword