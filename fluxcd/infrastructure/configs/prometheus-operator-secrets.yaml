apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-operator
  namespace: prometheus-operator
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: prometheus-operator-secrets
  data:
    - secretKey: username
      remoteRef:
        key: kv/kubernetes/prometheus-operator
        property: username
    - secretKey: password
      remoteRef:
        key: kv/kubernetes/prometheus-operator
        property: password