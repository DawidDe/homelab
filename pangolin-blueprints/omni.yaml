---
public-resources:
  omni:
    name: Omni
    protocol: http
    full-domain: omni.dawidde.de
    rules:
      - action: allow
        match: country
        value: DE
      - action: deny
        match: country
        value: ALL
    auth:
      sso-enabled: false
    targets:
      - site: heimdall
        method: http
        hostname: 127.0.0.1
        port: 8080
        healthcheck:
          enabled: true
          hostname: 127.0.0.1
          port: 8080
          path: /
          status: 200
  omni-api:
    name: Omni API
    protocol: http
    full-domain: api.omni.dawidde.de
    rules:
      - action: allow
        match: country
        value: DE
      - action: deny
        match: country
        value: ALL
    auth:
      sso-enabled: false
    targets:
      - site: heimdall
        method: h2c
        hostname: 127.0.0.1
        port: 8090
  omni-kube-api:
    name: Omni Kubernetes API
    protocol: http
    full-domain: kube.omni.dawidde.de
    rules:
      - action: allow
        match: country
        value: DE
      - action: deny
        match: country
        value: ALL
    auth:
      sso-enabled: false
    targets:
      - site: heimdall
        method: h2c
        hostname: 127.0.0.1
        port: 8100