---
public-resources:
  omni:
    name: Omni
    policy: base
    protocol: http
    full-domain: omni.dawidde.de
    targets:
      - site: heimdall
        method: http
        hostname: omni
        port: 8080
        healthcheck:
          enabled: true
          hostname: omni
          port: 8080
          path: /
          status: 200
  omni-api:
    name: Omni API
    policy: base
    protocol: http
    full-domain: api.omni.dawidde.de
    targets:
      - site: heimdall
        method: h2c
        hostname: omni
        port: 8090
  omni-kube-api:
    name: Omni Kubernetes API
    policy: base
    protocol: http
    full-domain: kube.omni.dawidde.de
    targets:
      - site: heimdall
        method: http
        hostname: omni
        port: 8100