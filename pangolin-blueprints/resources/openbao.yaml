---
public-resources:
  openbao:
    name: Openbao
    policy: base
    protocol: http
    full-domain: openbao.dawidde.de
    targets:
      - site: heimdall
        method: http
        hostname: openbao
        port: 8200
        healthcheck:
          enabled: true
          hostname: openbao
          port: 8200
          path: /v1/sys/health
          status: 200