---
public-resources:
  pocket-id:
    name: Pocket ID
    protocol: http
    full-domain: pocket-id.dawidde.de
    rules:
      - action: allow
        match: country
        value: DE
      - action: deny
        match: country
        value: ALL
    auth:
      sso-enabled: false
    targets:
      - site: heimdall
        method: http
        hostname: 127.0.0.1
        port: 1411
        healthcheck:
          enabled: true
          hostname: 127.0.0.1
          port: 1411
          path: /
          status: 200